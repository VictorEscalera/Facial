<ion-content class="auth-bg">
  <div class="auth-container fade-in">
    <div class="logo-container">
      <ion-icon name="person-add-outline" class="main-icon"></ion-icon>
      <h1>Crear Cuenta</h1>
      <p>Únete al sistema de AppFacial</p>
    </div>

    <!-- MODAL DE CÁMARA WEB (Solo visible en PC cuando se activa) -->
    <div *ngIf="camaraActiva" class="web-camera-modal fade-in">
      <div class="video-wrapper">
        <video #videoElement autoplay playsinline></video>
      </div>
      <div class="camera-actions">
        <ion-button color="danger" shape="round" (click)="cerrarCamara()">
          <ion-icon name="close-outline" slot="start"></ion-icon> Cancelar
        </ion-button>
        <ion-button color="success" shape="round" (click)="capturarDeVideo()">
          <ion-icon name="camera-outline" slot="start"></ion-icon> Capturar
        </ion-button>
      </div>
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="registrarUsuario()">
      <ion-card class="glass-card">
        <ion-card-content>
          
          <ion-item lines="none" class="custom-input">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-input formControlName="nombre" type="text" placeholder="Nombre completo"></ion-input>
          </ion-item>

          <ion-item lines="none" class="custom-input">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-input formControlName="email" type="email" placeholder="Correo electrónico"></ion-input>
          </ion-item>

          <ion-item lines="none" class="custom-input">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input formControlName="password" type="password" placeholder="Contraseña"></ion-input>
          </ion-item>

          <ion-item lines="none" class="custom-input">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
            <ion-input formControlName="confirmPassword" type="password" placeholder="Confirmar contraseña"></ion-input>
          </ion-item>

          <!-- type="button" evita que este botón intente enviar el formulario -->
          <ion-button type="button" expand="block" (click)="tomarFotoRegistro()" class="ion-margin-bottom" [class.foto-tomada]="fotoBase64">
            <ion-icon name="camera-outline" slot="start"></ion-icon>
            {{ fotoBase64 ? 'Foto capturada (Retomar)' : 'Tomar Foto Facial' }}
          </ion-button>

          <!-- Previsualización miniatura (opcional, para que el usuario vea su foto) -->
          <div *ngIf="fotoBase64" class="foto-preview">
            <img [src]="fotoBase64" alt="Foto capturada" />
          </div>

          <ion-button type="submit" expand="block" shape="round" class="main-btn" [disabled]="!registroForm.valid || !fotoBase64">
            Registrarse
          </ion-button>
          
          <div class="divider">o</div>

          <ion-button type="button" expand="block" fill="clear" class="link-btn" (click)="irALogin()">
            ¿Ya tienes cuenta? Inicia sesión
          </ion-button>

        </ion-card-content>
      </ion-card>
    </form>
  </div>
</ion-content>
